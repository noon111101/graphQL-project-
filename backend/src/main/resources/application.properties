spring.application.name=graphql-backend
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/shared_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=dbadmin
spring.datasource.password=Admin123456

# H2 Console (optional, can be disabled if not using H2)
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql

# CORS Configuration
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-methods=GET,POST

# Actuator Health Check Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
