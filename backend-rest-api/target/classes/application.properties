# Server Configuration
server.port=8081

# Application Name
spring.application.name=rest-api-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/shared_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=dbadmin
spring.datasource.password=Admin123456

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST

# Actuator Health Check Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
